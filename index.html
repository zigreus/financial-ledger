<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon_b2.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#38BDF8" />
    <meta name="description" content="가족이 함께 쓰는 가계부" />
    <link rel="apple-touch-icon" href="/logo192_transparent.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>지금 가계부</title>
    <script>
      // 이 기기의 화면 설정(글씨 크기·테마, ROADMAP U-1·U-2)을 그리기 전에 적용한다 — 어두운 테마가 밝게 번쩍이지 않게.
      // src/services/displayPrefs.js와 같은 열쇠·값이다(displayPrefs 테스트가 같은지 본다). 앱이 열리면 그 파일이 다시 적용한다.
      (function () {
        try {
          var scale = { small: 0.9, large: 1.15, xlarge: 1.3 }[localStorage.getItem('ledger_font_scale')];
          if (scale) document.documentElement.style.setProperty('--fs', String(scale));
          var theme = localStorage.getItem('ledger_theme');
          if (theme === 'dark' || theme === 'system') document.documentElement.setAttribute('data-theme', theme);
          // 위쪽 막대 색도 — 어두우면 머리글과 같은 색(displayPrefs.js의 DARK_BAR_COLOR, 밝은 색은 data-light에 둔다)
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var bar = document.querySelector('meta[name="theme-color"]');
          if (dark && bar) { bar.setAttribute('data-light', bar.getAttribute('content')); bar.setAttribute('content', '#1E293B'); }
        } catch (e) { /* 저장소가 막혀 있으면 기본(보통·밝게) */ }
      })();
    </script>
  </head>
  <body>
    <noscript>
      지금 가계부 — 가족이 함께 쓰는 가계부(가계부는 내 OneDrive·Google Drive에 저장). 이 앱을 쓰려면 JavaScript를 켜 주세요.
      <a href="/privacy.html">개인정보처리방침</a> · <a href="/terms.html">이용약관</a>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
